<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transit Pass — Login</title>

    <!-- Tipografi Karakteristik: Syne (Display), Plus Jakarta Sans (UI), JetBrains Mono (Teknis) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- GSAP Core (Pastikan file gsap.min.js ada di folder yang sama untuk mode offline) -->
    <script src="gsap.min.js"></script>
    <style>
        :root {
            --cream: #F7EED6;
            --cream-light: #FFFDF7;
            --blue: #257BE3;
            --blue-dark: #1A5FB4;
            --orange: #EA5A2B;
            --dark: #252B35;
            --border-w: 2.5px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--cream);
            background-image: radial-gradient(rgba(37, 43, 53, 0.16) 1.25px, transparent 1.25px);
            background-size: 22px 22px;
            color: var(--dark);
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 12px;
            border: 1.5px solid rgba(37, 43, 53, 0.18);
            border-radius: 16px;
            pointer-events: none;
            z-index: 1;
        }

        /* ================= LOGIN CARD ================= */
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--cream-light);
            border: var(--border-w) solid var(--dark);
            border-radius: 20px;
            box-shadow: 8px 8px 0px var(--dark);
            position: relative;
            z-index: 10;
            overflow: hidden;
            will-change: transform, opacity;
        }

        .card-header-strip {
            background: var(--dark);
            color: var(--cream);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--orange);
            box-shadow: 0 0 0 2px rgba(234, 90, 43, 0.35);
        }

        .card-body {
            padding: 30px 28px 32px;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: var(--blue);
            border: 2px solid var(--dark);
            border-radius: 12px;
            box-shadow: 3px 3px 0px var(--dark);
            margin-bottom: 18px;
            color: var(--cream-light);
        }

        .login-card h1 {
            font-family: 'Syne', sans-serif;
            font-size: 30px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .login-card p {
            color: #555D6B;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }

        .form-group label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--dark);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid var(--dark);
            border-radius: 11px;
            outline: none;
            background: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14.5px;
            font-weight: 500;
            color: var(--dark);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        .form-group input::placeholder {
            color: #9AA1AE;
            font-weight: 400;
        }

        .form-group input:focus {
            background: #FFFDF5;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--blue);
        }

        .toggle-pass {
            position: absolute;
            right: 10px;
            background: var(--cream);
            border: 1.5px solid var(--dark);
            border-radius: 7px;
            padding: 4px 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--dark);
            cursor: pointer;
            transition: background 0.15s;
        }

        .toggle-pass:hover {
            background: #EADDBB;
        }

        .login-btn {
            width: 100%;
            padding: 15px 18px;
            margin-top: 8px;
            border: 2px solid var(--dark);
            border-radius: 12px;
            background: var(--blue);
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 4px 4px 0px var(--dark);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
        }

        .login-btn:hover {
            background: var(--blue-dark);
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0px var(--dark);
        }

        .login-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--dark);
        }

        .login-btn svg {
            transition: transform 0.2s ease;
        }

        .login-btn:hover svg {
            transform: translateX(4px);
        }

        /* ================= TRANSISI MOBIL ================= */
        .transition-scene {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            z-index: 20;
            pointer-events: none;
        }

        .greeting-container {
            position: absolute;
            top: 22%;
            text-align: center;
            padding: 0 20px;
            opacity: 0;
        }

        .greeting-badge {
            display: inline-block;
            background: var(--orange);
            color: #FFFFFF;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 5px 12px;
            border: 2px solid var(--dark);
            border-radius: 999px;
            box-shadow: 3px 3px 0px var(--dark);
            margin-bottom: 12px;
        }

        .welcome-text {
            font-family: 'Syne', sans-serif;
            font-size: clamp(26px, 5vw, 40px);
            font-weight: 800;
            color: var(--dark);
            line-height: 1.15;
        }

        .welcome-text span {
            color: var(--blue);
        }

        .stage {
            position: relative;
            width: 100%;
            height: 220px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-top: 60px;
        }

        .road-container {
            position: absolute;
            bottom: 34px;
            width: 100%;
            height: 24px;
            overflow: hidden;
        }

        .road-line {
            width: 100%;
            height: 3px;
            background: var(--dark);
            transform-origin: left center;
            transform: scaleX(0);
        }

        .road-dashes {
            position: absolute;
            top: 10px;
            left: 0;
            width: 200%;
            height: 3px;
            background-image: repeating-linear-gradient(
                to right,
                rgba(37, 43, 53, 0.35) 0px,
                rgba(37, 43, 53, 0.35) 28px,
                transparent 28px,
                transparent 64px
            );
            opacity: 0;
        }

        .car-wrapper {
            position: relative;
            width: 290px;
            height: 130px;
            margin-bottom: 35px;
            opacity: 0;
            will-change: transform, opacity;
        }

        .car-chassis {
            position: relative;
            width: 100%;
            height: 100%;
            transform-origin: bottom center;
        }

        .headlight-beam {
            position: absolute;
            right: -135px;
            bottom: 24px;
            width: 150px;
            height: 54px;
            background: linear-gradient(90deg, rgba(234, 90, 43, 0.38) 0%, rgba(234, 90, 43, 0) 100%);
            clip-path: polygon(0 35%, 100% 0%, 100% 100%, 0 65%);
            opacity: 0;
            pointer-events: none;
        }

        .exhaust-group {
            position: absolute;
            left: -14px;
            bottom: 24px;
        }

        .puff {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #FFFFFF;
            border: 2px solid var(--dark);
            border-radius: 50%;
            opacity: 0;
        }

        .wheel {
            position: absolute;
            width: 48px;
            height: 48px;
            bottom: 0;
            background: var(--dark);
            border: 2.5px solid var(--dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .wheel.rear {
            left: 42px;
        }

        .wheel.front {
            right: 44px;
        }

        .wheel-rim {
            width: 26px;
            height: 26px;
            background: var(--cream);
            border: 2px solid var(--dark);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-rim::before,
        .wheel-rim::after {
            content: "";
            position: absolute;
            background: var(--dark);
        }

        .wheel-rim::before {
            width: 100%;
            height: 2px;
        }

        .wheel-rim::after {
            width: 2px;
            height: 100%;
        }

        .wheel-hub {
            width: 8px;
            height: 8px;
            background: var(--orange);
            border: 1.5px solid var(--dark);
            border-radius: 50%;
            z-index: 2;
        }

        .speed-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
        }

        .speed-line {
            position: absolute;
            height: 2.5px;
            background: var(--blue);
            border-radius: 2px;
        }

        @media (max-width: 450px) {
            body::before {
                inset: 8px;
            }

            .login-card {
                width: 100%;
                box-shadow: 6px 6px 0px var(--dark);
            }

            .card-body {
                padding: 24px 20px 26px;
            }

            .car-wrapper {
                transform: scale(0.84);
            }
        }
    </style>
</head>

<body>

    <!-- KARTU LOGIN -->
    <main class="login-card" id="loginCard">
        <div class="card-header-strip">
            <span>GATE // 04-ID</span>
            <span class="status-pill">
                <span class="status-dot"></span>
                READY
            </span>
        </div>

        <div class="card-body">
            <div class="brand-mark" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"/>
                    <circle cx="12" cy="12" r="2.5"/>
                    <path d="M12 3v6.5"/>
                    <path d="M4.2 16.5l5.6-3.2"/>
                    <path d="M19.8 16.5l-5.6-3.2"/>
                </svg>
            </div>

            <h1>Welcome Back.</h1>
            <p>Masukkan kredensial Anda untuk memulai perjalanan ke dashboard.</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <div class="label-row">
                        <label for="username">Username</label>
                    </div>
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="cth. mario.okk"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                    </div>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">
                            SHOW
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="submitBtn">
                    <span>Masuk Sekarang</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>
        </div>
    </main>

    <!-- ADEGAN TRANSISI MOBIL -->
    <section class="transition-scene" id="transitionScene" aria-hidden="true">
        <div class="greeting-container" id="greetingBox">
            <div class="greeting-badge">AKSES DITERIMA</div>
            <div class="welcome-text">Berangkat, <span id="displayUser">Driver</span>!</div>
        </div>

        <div class="stage">
            <div class="speed-lines" id="speedLines">
                <div class="speed-line" style="top: 25%; left: 15%; width: 90px;"></div>
                <div class="speed-line" style="top: 48%; left: 60%; width: 130px;"></div>
                <div class="speed-line" style="top: 65%; left: 25%; width: 70px;"></div>
            </div>

            <div class="car-wrapper" id="carWrapper">
                <div class="exhaust-group">
                    <div class="puff puff-1"></div>
                    <div class="puff puff-2"></div>
                </div>

                <div class="car-chassis" id="carChassis">
                    <div class="headlight-beam" id="headlightBeam"></div>

                    <svg width="290" height="118" viewBox="0 0 290 118" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <line x1="88" y1="13" x2="162" y2="13" stroke="#252B35" stroke-width="3" stroke-linecap="round"/>
                        <line x1="100" y1="13" x2="100" y2="20" stroke="#252B35" stroke-width="3"/>
                        <line x1="150" y1="13" x2="150" y2="20" stroke="#252B35" stroke-width="3"/>
                        <path d="M24 94H268C273.5 94 277 89.5 277 84V66C277 56 269 49 258 47L218 42L185 21C178 17 170 16 161 16H94C80 16 68 23 59 34L36 52C24 56 18 65 18 77V85C18 90 20.5 94 24 94Z" fill="#257BE3" stroke="#252B35" stroke-width="3" stroke-linejoin="round"/>
                        <path d="M20 82H275" stroke="#1A5FB4" stroke-width="6"/>
                        <path d="M26 62H262" stroke="#F7EED6" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M68 44L87 24C90 21 94 20 98 20H122V44H68Z" fill="#F7EED6" stroke="#252B35" stroke-width="2.5" stroke-linejoin="round"/>
                        <path d="M130 20H163C169 20 174 22 179 25L204 44H130V20Z" fill="#F7EED6" stroke="#252B35" stroke-width="2.5" stroke-linejoin="round"/>
                        <line x1="145" y1="25" x2="138" y2="39" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="153" y1="25" x2="148" y2="35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                        <rect x="192" y="39" width="12" height="8" rx="3" fill="#EA5A2B" stroke="#252B35" stroke-width="2"/>
                        <line x1="138" y1="54" x2="152" y2="54" stroke="#252B35" stroke-width="3" stroke-linecap="round"/>
                        <rect x="267" y="55" width="11" height="15" rx="4" fill="#EA5A2B" stroke="#252B35" stroke-width="2.5"/>
                        <rect x="15" y="58" width="7" height="14" rx="2" fill="#EA5A2B" stroke="#252B35" stroke-width="2"/>
                        <rect x="11" y="83" width="16" height="11" rx="4" fill="#F7EED6" stroke="#252B35" stroke-width="2.5"/>
                        <rect x="264" y="83" width="18" height="11" rx="4" fill="#F7EED6" stroke="#252B35" stroke-width="2.5"/>
                        <path d="M40 94C40 78 52 67 66 67C80 67 92 78 92 94" fill="#252B35"/>
                        <path d="M196 94C196 78 208 67 222 67C236 67 248 78 248 94" fill="#252B35"/>
                    </svg>
                </div>

                <div class="wheel rear">
                    <div class="wheel-rim">
                        <div class="wheel-hub"></div>
                    </div>
                </div>
                <div class="wheel front">
                    <div class="wheel-rim">
                        <div class="wheel-hub"></div>
                    </div>
                </div>
            </div>

            <div class="road-container">
                <div class="road-line" id="roadLine"></div>
                <div class="road-dashes" id="roadDashes"></div>
            </div>
        </div>
    </section>

    <script>
        const form = document.getElementById("loginForm");
        const card = document.getElementById("loginCard");
        const scene = document.getElementById("transitionScene");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const togglePassBtn = document.getElementById("togglePass");
        const displayUser = document.getElementById("displayUser");

        let idleTween = null;

        gsap.from(card, {
            y: 24,
            opacity: 0,
            duration: 0.65,
            ease: "power3.out"
        });

        togglePassBtn.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            togglePassBtn.textContent = isPassword ? "HIDE" : "SHOW";
        });

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            if (!form.reportValidity()) {
                gsap.fromTo(card,
                    { x: -6 },
                    { x: 6, duration: 0.06, repeat: 5, yoyo: true, clearProps: "x" }
                );
                return;
            }

            const rawName = usernameInput.value.trim();
            const formattedName = rawName.charAt(0).toUpperCase() + rawName.slice(1);
            displayUser.textContent = formattedName || "Driver";

            const button = form.querySelector("button[type='submit']");
            button.disabled = true;

            const travelDistance = window.innerWidth / 2 + 340;

            const tl = gsap.timeline({
                onComplete: () => {
                    if (idleTween) idleTween.kill();
                    
                    // Berpindah secara otomatis ke dashboard.html setelah animasi selesai
                    window.location.href = "dashboard.html";
                }
            });

            // 1. Kartu login terangkat & menghilang
            tl.to(card, {
                y: -30,
                scale: 0.92,
                opacity: 0,
                duration: 0.4,
                ease: "power2.in"
            });

            // 2. Tampilkan scene mobil & garis jalan
            tl.set(scene, { visibility: "visible" });
            tl.set("#carWrapper", { x: -travelDistance, opacity: 1 });

            tl.to("#roadLine", {
                scaleX: 1,
                duration: 0.45,
                ease: "power2.out"
            });

            // 3. Mobil meluncur masuk ke tengah
            tl.to("#carWrapper", {
                x: 0,
                duration: 0.85,
                ease: "power3.out"
            }, "-=0.2");

            tl.to(".wheel", {
                rotation: 540,
                duration: 0.85,
                ease: "power3.out"
            }, "<");

            tl.to("#carChassis", {
                rotation: 2.2,
                y: 2,
                duration: 0.25,
                yoyo: true,
                repeat: 1,
                ease: "power1.inOut"
            }, "-=0.25");

            // 4. Lampu menyala & teks sapaan muncul
            tl.to("#headlightBeam", {
                opacity: 1,
                duration: 0.2
            }, "-=0.1");

            tl.to("#greetingBox", {
                opacity: 1,
                y: -12,
                duration: 0.45,
                ease: "back.out(1.5)",
                onStart: () => {
                    idleTween = gsap.to("#carChassis", {
                        y: -1.8,
                        duration: 0.08,
                        repeat: -1,
                        yoyo: true
                    });
                }
            }, "<");

            tl.fromTo(".puff-1",
                { x: 0, y: 0, scale: 0.4, opacity: 0.9 },
                { x: -28, y: -14, scale: 1.3, opacity: 0, duration: 0.55, ease: "power1.out" },
                "<"
            );
            tl.fromTo(".puff-2",
                { x: 0, y: 0, scale: 0.3, opacity: 0.8 },
                { x: -36, y: -8, scale: 1.5, opacity: 0, duration: 0.6, ease: "power1.out" },
                "<0.15"
            );

            // 5. Mobil tancap gas melesat keluar layar
            tl.addLabel("accelerate", "+=0.45");

            tl.to("#carChassis", {
                rotation: -2.8,
                duration: 0.25,
                ease: "power2.out"
            }, "accelerate");

            tl.to("#roadDashes", {
                opacity: 1,
                x: -300,
                duration: 1.1,
                ease: "power2.in"
            }, "accelerate");

            tl.to("#speedLines", {
                opacity: 0.7,
                x: -120,
                duration: 0.9,
                ease: "power2.in"
            }, "accelerate+=0.1");

            tl.to(".wheel", {
                rotation: "+=1440",
                duration: 1.15,
                ease: "power3.in"
            }, "accelerate");

            tl.to("#carWrapper", {
                x: travelDistance,
                duration: 1.15,
                ease: "power3.in"
            }, "accelerate");

            tl.to("#greetingBox", {
                opacity: 0,
                y: -25,
                duration: 0.35,
                ease: "power2.in"
            }, "accelerate+=0.45");
        });
    </script>

</body>
</html>
